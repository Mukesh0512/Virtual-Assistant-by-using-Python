<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
  <title>Web Virtual Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body onload="playStartup()">
<audio id="bg-music" src="static/sounds/music.mp3"></audio>
<audio id="startup-sound" src="static/sounds/startup.mp3"></audio>
<audio id="shutdown-sound" src="static/sounds/shutdown.mp3"></audio>

  <a id="fake-link" href="#" target="_blank" style="display:none;"></a>

  <div class="container">
    <h1>🤖 Welcome to Jarvis</h1>

  </div>
