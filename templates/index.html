<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/png">
  <title>Web Virtual Assistant</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body onload="playStartup()">
  <audio id="bg-music" src="{{ url_for('static', filename='music.mp3') }}" autoplay loop></audio>
  <audio id="startup-sound" src="{{ url_for('static', filename='startup.mp3') }}"></audio>
  <audio id="shutdown-sound" src="{{ url_for('static', filename='shutdown.mp3') }}"></audio>
  <audio id="error-sound" src="{{ url_for('static', filename='error.mp3') }}"></audio>

  <a id="fake-link" href="#" target="_blank" style="display:none;"></a>

  <div class="container">
    <h1>🤖 Welcome to Jarvis</h1>
    <button id="start-btn">🎤 Start Listening</button>
    <p id="user-text"></p>
    <div id="response-text" class="typewriter"></div>

    <h3>📝 Command History</h3>
    <ul id="command-history"></ul>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
